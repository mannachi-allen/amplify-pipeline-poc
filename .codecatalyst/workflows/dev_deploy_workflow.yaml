Name: AmplifyDeployWorkflow
SchemaVersion: "1.0"

# Trigger on push to main branch
Triggers:
  - Type: Push
    Branches:
      - main

Actions:
  Install_And_Configure:
    Identifier: aws/build@v1
    Inputs:
      Sources:
        - WorkflowSource
    Compute:
      Type: EC2
    Configuration:
      Steps:
        # Install dependencies
        - Run: |
            npm install -g @aws-amplify/cli
            npm install
        
        # Configure Amplify CLI with environment variables
        - Run: |
            export FRONTEND_CONFIG='{
              "frontend": "javascript",
              "framework": "react",
              "config": {
                "SourceDir": "src",
                "DistributionDir": "build",
                "BuildCommand": "npm run build",
                "StartCommand": "npm start"
              }
            }'
            export PROVIDER_CONFIG='{
              "awscloudformation": {
                "configLevel": "project",
                "useProfile": false
              }
            }'
            
        # Initialize Amplify
        - Run: |
            amplify init \
            --app $AMPLIFY_APP_ID \
            --frontend "$FRONTEND_CONFIG" \
            --provider "$PROVIDER_CONFIG" \
            --yes

  Build_And_Deploy:
    Identifier: aws/build@v1
    DependsOn:
      - Install_And_Configure
    Inputs:
      Sources:
        - WorkflowSource
    Environment:
      Connections:
        - Role: CodeCatalystWorkflowDevelopmentRole-cdktest
          Name: "Dev"
      Name: Dev 
    Compute:
      Type: EC2
    Configuration:
      Steps:
        # Build the application
        - Run: npm run build
        
        # Push to Amplify
        - Run: amplify push --yes
    Outputs:
      Artifacts:
        - Name : build
          Files : 
            - ./build

  DeployToAmplify:
    Identifier: codecatalyst-labs/deploy-to-amplify-hosting@v1
    DependsOn:
      - Build_And_Deploy
    Inputs:
      Artifacts:
        - build
    Configuration:
      Wait: true
      AWSRegion: us-east-1
      AppStackName: ${PROJECT_NAME}
      CreateBranch: true
      AmplifyBranchName: ${WorkflowSource.BranchName}
      Path: build
    Environment:
      Connections:
        - Role: CodeCatalystWorkflowDevelopmentRole-cdktest
          Name: "Dev"
      Name: Dev
